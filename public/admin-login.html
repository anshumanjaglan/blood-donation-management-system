<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrator Login | Blood Donation Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background:#f1f5f9;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;padding:20px;">

  <div style="max-width:420px;width:100%;">
    <div style="text-align:center;margin-bottom:28px;">
      <a href="index.html" class="brand" style="justify-content:center;margin-bottom:12px;">
        <div class="brand-icon" style="width:48px;height:48px;">
          <svg viewBox="0 0 24 24" style="width:26px;height:26px;"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
        </div>
      </a>
      <h1 style="font-size:1.6rem;font-weight:800;color:var(--text-main);">Administrator Portal</h1>
      <p style="color:var(--text-muted);font-size:0.9rem;">Sign in to access blood bank inventory, request approvals, and donor controls.</p>
    </div>

    <div class="card" style="box-shadow:var(--shadow-lg);padding:32px;">
      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="username" class="form-control" placeholder="admin" value="admin" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" value="password123" required autocomplete="current-password">
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:0.85rem;">
          <label class="checkbox-label" style="margin-bottom:0;">
            <input type="checkbox" checked>
            <span>Remember me</span>
          </label>
          <span style="color:var(--text-light);">Secure SSL</span>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-block" style="height:44px;">
          Sign In to Dashboard &rarr;
        </button>
      </form>

      <!-- Project Demo Credentials Helper -->
      <div style="margin-top:20px;padding:12px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:var(--radius-sm);font-size:0.8rem;color:#1e40af;">
        <strong>Minor Project Evaluator Note:</strong><br>
        Demo Login Credentials:<br>
        Username: <code>admin</code> &bull; Password: <code>password123</code>
      </div>
    </div>

    <div style="text-align:center;margin-top:16px;">
      <a href="index.html" style="font-size:0.85rem;color:var(--text-muted);">&larr; Return to Public Portal</a>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerText = 'Authenticating...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const json = await res.json();

        if (json.success && json.token) {
          localStorage.setItem('blood_admin_token', json.token);
          localStorage.setItem('blood_admin_user', JSON.stringify(json.user));
          showToast('Login authorized. Loading dashboard...', 'success');
          setTimeout(() => {
            window.location.href = 'admin-dashboard.html';
          }, 600);
        } else {
          showToast(json.message || 'Invalid username or password', 'error');
          btn.disabled = false;
          btn.innerText = 'Sign In to Dashboard →';
        }
      } catch (err) {
        showToast('Connection error during authentication', 'error');
        btn.disabled = false;
        btn.innerText = 'Sign In to Dashboard →';
      }
    });
  </script>
</body>
</html>
